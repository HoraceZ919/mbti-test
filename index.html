<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MBTI 人格测试 · 四道题</title>
<meta name="description" content="四道情境题，对应 MBTI 的四个维度。凭第一直觉选，看看你的类型。">
<meta property="og:title" content="MBTI 人格测试 · 四道题">
<meta property="og:description" content="四道情境题，对应 MBTI 的四个维度。凭第一直觉选，看看你的类型。">
<meta name="theme-color" content="#f7f5f0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46d6'/><text x='50' y='68' font-size='52' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'>M</text></svg>">
<style>
  :root{
    --bg:#f7f5f0;
    --card:#ffffff;
    --ink:#1b1a17;
    --ink-2:#454139;
    --muted:#8a857c;
    --line:#e8e4db;
    --accent:#4f46d6;
    --soft:#f3f1ff;
    --radius:22px;
    --maxw:660px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 620px at 12% -12%, #e9e5ff 0%, rgba(233,229,255,0) 62%),
      radial-gradient(720px 520px at 102% 2%, #e0f3ef 0%, rgba(224,243,239,0) 58%),
      var(--bg);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
    padding-bottom:132px;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

  /* ---------- 顶部 ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 2px 10px;font-size:12px;letter-spacing:.14em;
    color:var(--muted);text-transform:uppercase;font-weight:600;
  }
  .topbar .mark{display:flex;align-items:center;gap:8px;color:var(--ink);letter-spacing:.08em}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(79,70,214,.12)}
  .topbar .ver{letter-spacing:.1em}

  /* ---------- 卡片 ---------- */
  .card{
    background:var(--card);
    border:1px solid rgba(27,26,23,.06);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(24,20,50,.04), 0 26px 60px -38px rgba(24,20,50,.38);
    padding:30px 24px 28px;
    margin-top:6px;
  }
  .screen{display:none}
  .screen.on{display:block;animation:rise .42s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ---------- 开始页 ---------- */
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11.5px;letter-spacing:.16em;font-weight:650;color:var(--accent);
    background:var(--soft);border-radius:100px;padding:6px 12px;
  }
  h1{
    font-size:clamp(30px,8vw,42px);line-height:1.22;letter-spacing:-.02em;
    font-weight:750;margin:18px 0 0;
  }
  h1 em{font-style:normal;color:var(--accent)}
  .lead{margin:16px 0 0;font-size:15.5px;line-height:1.85;color:var(--ink-2)}
  .facts{display:flex;gap:10px;margin:24px 0 0;flex-wrap:wrap}
  .fact{
    flex:1 1 0;min-width:0;border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;background:#fcfbf8;
  }
  .fact b{display:block;font-size:19px;letter-spacing:-.01em;font-weight:700;line-height:1.25;margin-bottom:2px}
  .fact span{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
  .note{
    margin-top:22px;padding-top:18px;border-top:1px dashed var(--line);
    font-size:12.5px;color:var(--muted);line-height:1.75;
  }

  /* ---------- 进度 ---------- */
  .bar{display:flex;gap:6px;margin-bottom:22px}
  .bar i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:.35s}
  .bar i.done{background:var(--accent)}
  .bar i.now{background:linear-gradient(90deg,var(--accent),#9a8cff)}

  /* ---------- 题目 ---------- */
  .qhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
  .qidx{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--ink);font-variant-numeric:tabular-nums}
  .qidx span{color:var(--muted);font-weight:500;font-size:12px}
  .qdim{
    font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-align:right;
    max-width:62%;
  }
  .scene{
    margin:14px 0 4px;font-size:15px;line-height:1.95;color:#34312b;
    padding-left:14px;border-left:2px solid #ded8f8;
  }
  .scene b{font-weight:650;color:var(--ink)}

  .opts{margin-top:18px;display:flex;flex-direction:column;gap:12px}
  .opt{
    display:block;width:100%;text-align:left;font:inherit;color:inherit;
    background:#fff;border:1.5px solid var(--line);border-radius:16px;
    padding:15px 16px 17px;cursor:pointer;
    transition:border-color .18s, background .18s, box-shadow .18s, transform .12s;
  }
  .opt:hover{border-color:#cfc9f5}
  .opt:active{transform:scale(.994)}
  .opt.on{
    border-color:var(--accent);
    background:linear-gradient(180deg,#fbfaff,#f4f2ff);
    box-shadow:0 0 0 3px rgba(79,70,214,.09);
  }
  .opt-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:25px;height:25px;border-radius:8px;flex:none;
    background:#f2efe8;color:#7a7268;
    font-size:12.5px;font-weight:750;letter-spacing:.02em;
    transition:.18s;
  }
  .opt.on .badge{background:var(--accent);color:#fff}
  .opt-title{font-size:16.5px;font-weight:700;letter-spacing:-.005em;line-height:1.5}
  .opt-sub{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin:5px 0 0}
  .opt.on .opt-sub{color:#7b72d8}
  .opt-body{
    margin:11px 0 0;font-size:14px;line-height:1.92;color:var(--ink-2);
    letter-spacing:.002em;
  }
  .opt.on .opt-body{color:#3a3653}
  .tick{
    margin-left:auto;width:18px;height:18px;border-radius:50%;flex:none;
    border:1.5px solid var(--line);position:relative;transition:.18s;
  }
  .opt.on .tick{border-color:var(--accent);background:var(--accent)}
  .opt.on .tick::after{
    content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;
    border-right:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(42deg);
  }

  /* ---------- 底部操作条 ---------- */
  .actions{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 20px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(247,245,240,0) 0%, rgba(247,245,240,.92) 34%, var(--bg) 74%);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:none;
  }
  .actions.show{display:block;animation:rise .3s ease both}
  .actions .inner{max-width:var(--maxw);margin:0 auto;display:flex;gap:10px}
  .btn{
    flex:1;font:inherit;font-size:15.5px;font-weight:650;letter-spacing:.01em;
    color:#fff;background:var(--ink);border:0;border-radius:15px;padding:16px 18px;
    cursor:pointer;transition:.18s;
  }
  .btn:active{transform:scale(.99)}
  .btn:disabled{opacity:.24;cursor:default}
  .btn.primary{background:var(--accent)}
  .btn.ghost{
    flex:0 0 auto;background:transparent;color:var(--ink-2);
    border:1.5px solid var(--line);padding:16px 20px;
  }

  /* ---------- 结果页 ---------- */
  .result-top{text-align:left;padding-bottom:4px}
  .type{
    font-size:clamp(48px,15vw,68px);line-height:1;font-weight:750;
    letter-spacing:.13em;margin:14px 0 0;color:var(--accent);
    margin-left:.13em;
  }
  .typename{margin:12px 0 0;font-size:18px;font-weight:700}
  .typename .en{font-weight:500;color:var(--muted);font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
  .tagline{margin:18px 0 0;font-size:15px;line-height:1.9;color:var(--ink-2)}
  .desc{
    margin:16px 0 0;font-size:14.5px;line-height:1.95;color:var(--ink-2);
    padding:16px 16px;background:#fbfaf7;border-radius:14px;border:1px solid #f0ece3;
  }
  .sec-title{
    margin:30px 0 12px;font-size:11.5px;letter-spacing:.14em;font-weight:700;
    color:var(--muted);text-transform:uppercase;
  }
  .dims{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .dims li{
    padding:14px 2px;border-bottom:1px solid var(--line);
  }
  .dim-main{display:flex;align-items:baseline;gap:10px;font-size:13.5px}
  .dims .p{font-weight:800;color:var(--accent);width:16px;flex:none}
  .dims .n{font-weight:650}
  .dim-alt{padding-left:26px;margin-top:3px;color:var(--muted);font-size:11.5px;line-height:1.6}

  .check{
    margin-top:18px;padding:13px 15px;border-radius:13px;
    background:#fbfaf6;border:1px solid #f0ece3;
    font-size:12.5px;line-height:1.85;color:#6b665c;
  }
  .check b{display:block;font-size:10px;letter-spacing:.14em;color:#a8a196;margin-bottom:5px;font-weight:700}
  .foot{margin-top:22px;font-size:11.5px;color:var(--muted);line-height:1.8}

  @media (max-width:380px){
    .card{padding:24px 18px 24px}
    .opt-body{font-size:13.5px}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="mark"><span class="dot"></span>MBTI · 四维速测</div>
    <div class="ver">4 Questions</div>
  </div>

  <!-- 开始 -->
  <section class="screen on" id="screen-intro">
    <div class="card">
      <span class="kicker">开始之前</span>
      <h1>四道题，<br>看清自己的<em>第一反应</em></h1>
      <p class="lead">四道题分别对应四个维度。每题给一个具体场景，两个选项没有对错，也不用挑“看起来更高级的那个”——选你身上真实发生的那一个。</p>
      <div class="facts">
        <div class="fact"><b>4</b><span>道情境题</span></div>
        <div class="fact"><b>2</b><span>分钟</span></div>
        <div class="fact"><b>16</b><span>种类型</span></div>
      </div>
      <button class="btn primary" id="startBtn" type="button" style="margin-top:24px;width:100%">开始测试</button>
      <p class="note">这是基于四个维度的简化版本，不是官方 MBTI 量表，结果供自我观察与娱乐参考。</p>
    </div>
  </section>

  <!-- 答题 -->
  <section class="screen" id="screen-quiz">
    <div class="card">
      <div class="bar" id="bar"></div>
      <div class="qhead">
        <div class="qidx" id="qidx"></div>
        <div class="qdim" id="qdim"></div>
      </div>
      <div id="quizBody"></div>
    </div>
  </section>

  <!-- 结果 -->
  <section class="screen" id="screen-result">
    <div class="card">
      <div class="result-top">
        <span class="kicker">你的类型</span>
        <div class="type" id="rType"></div>
        <p class="typename" id="rName"></p>
        <p class="tagline" id="rTag"></p>
        <div class="desc" id="rDesc"></div>
      </div>
      <div class="sec-title">四个维度的落点</div>
      <ul class="dims" id="rDims"></ul>
      <p class="foot">结果反映的是此刻的倾向，不是终身标签。同一道题，隔半年再选，答案常常不一样。</p>
    </div>
  </section>
</div>

<div class="actions" id="actions">
  <div class="inner">
    <button class="btn ghost" id="prevBtn" type="button">上一题</button>
    <button class="btn primary" id="nextBtn" type="button" disabled>下一题</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var QUESTIONS = [
    {
      name: "精力的回血方式",
      scene: "连轴转忙完一整周，终于迎来完全属于自己的周末。撇开工作应酬和社交礼貌，单看你身体和大脑最本能的“回血”方式：",
      check: "真正让你缓过劲来的，是走出去跟人和世界产生碰撞，还是退回来把自己藏进绝对安静的壳里？",
      options: [
        {
          letter: "E",
          title: "在热闹与互动中满血复活",
          body: "哪怕身体有点累，只要走出门去吹吹风、钻进有烟火气的街巷，或者约上合拍的朋友吃顿饭、聊聊天，你的精神头反而能很快被重新点亮。<br><br>如果让你一连两三天关在屋里谁也不见、什么新鲜外界刺激都没有，你不仅不会觉得休息好了，反而容易觉得整个人发闷、发蔫。"
        },
        {
          letter: "I",
          title: "在独处与静音中缓慢回温",
          body: "只要身边有人、需要对外做出反应，哪怕聚会气氛再好、聊得再尽兴，你的精神电量其实都在缓慢往下掉。<br><br>只有彻底关上门、把手机调成静音，待在完全没人打扰的私人空间里发呆或做自己的事，你紧绷的神经才算真正松下来，开始恢复元气。"
        }
      ]
    },
    {
      name: "好奇心的落脚点",
      scene: "平时刷视频、看书、聊天或者发展个人爱好时，哪一类内容最能让你产生“有意思、想多看两眼”的兴奋感？",
      check: "让你觉得更过瘾的，是现实世界里鲜活、确凿的体验与干货，还是跳出眼前事实去琢磨规律、玩味各种可能性？",
      options: [
        {
          letter: "S",
          title: "迷恋真实可感的细节与经验",
          body: "你的注意力天然被“看得见、摸得着、用得上”的事物吸引。无论是美食的口感层次、摄影的光影质感、手工与器材的实操技巧，还是真实发生的具体故事与生活经验。<br><br>你喜欢脚踏实地的充实感；如果话题彻底脱离现实，变成纯粹的概念空谈或天马行空的假想，你会觉得干巴、飘忽，很难真正投入进去。"
        },
        {
          letter: "N",
          title: "迷恋表象背后的规律与想象",
          body: "你的注意力总是不自觉地穿过表面事实，去琢磨“它为什么会这样”或者“还能衍生出什么可能”。哪怕是一个现实中毫无用处的脑洞假设、历史隐喻，或是某种抽象的底层规律，只要能把不同事物串联起来、想通其中的门道，你就会觉得极其过瘾。<br><br>如果长期只接触日常琐事和按部就班的具体操作，你会觉得思维像生了锈一样无聊。"
        }
      ]
    },
    {
      name: "面对倾诉时的内心本能",
      scene: "好朋友因为自己的失误把一件重要的事搞砸了，跑来找你大吐苦水。假设我们都有基本的同理心，第一反应肯定都是先安慰对方；但安慰过后，你内心深处觉得怎样做才算“真正帮到了 TA”？",
      check: "安慰朋友时，你觉得更有价值的终点是帮 TA 看清问题、把事情摆平，还是接住 TA 的脆弱、把心情抚平？",
      options: [
        {
          letter: "T",
          title: "帮 TA 理清症结，找到破局的办法",
          body: "在你看来，安抚情绪只是帮对方冷静下来的第一步；要想真正渡过难关，终究得弄清楚问题出在哪、接下来怎么补救或止损。<br><br>等对方情绪缓和后，你会本能地想帮 TA 复盘来龙去脉、捋出解决方案。如果只是顺着对方的话一味附和安慰，却对近在眼前的实际问题视而不见，你会觉得这种陪伴有点敷衍，没解决根本问题。"
        },
        {
          letter: "F",
          title: "给 TA 情绪托底，让 TA 知道有人撑腰",
          body: "在你看来，当一个人受挫脆弱时，“感到自己被理解、被接纳、有人无条件站在自己这边”本身就是最大的治愈。<br><br>哪怕这件事眼下没有解决办法，甚至原本就是朋友自己没做好，只要能接住 TA 的委屈、让 TA 觉得温暖不孤单，这次倾听就非常有价值。在别人正难过的时候急着去分析对错、扮演“人生导师”指点江山，会让你觉得太过冰冷。"
        }
      ]
    },
    {
      name: "做计划时的确定感需求",
      scene: "你需要安排一次出行或推进一项重要事务。抛开拖延症不谈——假设时间充裕，你也已经挑中了一套还不错的方案，接下来你更习惯哪种状态？",
      check: "做安排时，定下方案是为了尽早消除不确定感、让心里尘埃落定，还是只当个保底参考、随时欢迎计划之外的新变化？",
      options: [
        {
          letter: "J",
          title: "尽早拍板落定，心里才踏实",
          body: "方案既然合适，你就会倾向于赶紧敲定下来，把这件事从脑子里“划掉”，然后安心去干别的。<br><br>对你来说，事情悬在半空没个准信儿，哪怕不用马上处理，心里也会隐隐觉得有桩心事挂着。你喜欢一切按计划稳步推进的秩序感；如果没什么硬伤却要临时推翻重来，会让你觉得被打乱了节奏，非常折腾。"
        },
        {
          letter: "P",
          title: "留出机动空间，随时看情况调整",
          body: "哪怕提前订好了方案，在你心里那也只是一个“保底选项”，不代表事情就这么定死了。<br><br>如果把未来的每一天、每一步都早早锁死，反而会让你产生一种被框住的束缚感。你更喜欢在最终截止前保留一点随机应变的余地——万一到时候心情变了、或者突然发现了更好玩的去处，能够顺着当下的状态随时拐个弯，会让你觉得自在得多。"
        }
      ]
    }
  ];

  var TYPES = {
    INTJ: ["建筑师", "Architect",
      "习惯先在心里把整件事的骨架搭好，再动手。别人看到的是结论，你脑子里跑的是整套推演。不太爱解释过程，因为觉得说清楚比做完更累。",
      "代价是身边的人常常要到很后面才知道你在想什么，而你已经默认他们知道了。"],
    INTP: ["逻辑学家", "Logician",
      "对“这个说法站不站得住”有种本能的敏感，哪怕它跟现实无关。想通一件事的快感，往往大于把这件事做成。",
      "代价是很多想法停在“想明白了”这一步，没变成任何能拿出来的东西。"],
    ENTJ: ["指挥官", "Commander",
      "看事情先看目标和路径，中间的人情摩擦在你眼里多半是待解决的成本。定下来的事，你不太接受“再看看”。",
      "代价是你会低估那些“效率上说不通、但对人很重要”的部分。"],
    ENTP: ["辩论家", "Debater",
      "喜欢把一个定论拆开，看看换个角度会怎样。不是要赢，是受不了事情只有一个说法。",
      "代价是很少有一件事被你真正做完，兴趣已经转到下一个。"],
    INFJ: ["提倡者", "Advocate",
      "对人的情绪有近乎过载的感知，同时又在心里守着一套不肯让步的标准。看着温和，其实很难被说动。",
      "代价是你替别人消化了太多情绪，却很少让人看见自己的消耗。"],
    INFP: ["调停者", "Mediator",
      "心里有一套很私人的价值排序，平时不拿出来讲。真被踩到的时候，会安静地退出，而不是争论。",
      "代价是很多话没说出口，别人以为你不在意。"],
    ENFJ: ["主人公", "Protagonist",
      "很自然地去照顾一个场子里每个人的状态，也真心希望别人好。",
      "代价是你会把别人的期待当成自己的目标，直到某天突然撑不住。"],
    ENFP: ["竞选者", "Campaigner",
      "对新鲜的人和事有种停不下来的兴奋，同时对人本身的处境很在意。",
      "代价是热情来得快也散得快，收尾的活儿总落在别人或未来的自己身上。"],
    ISTJ: ["物流师", "Logistician",
      "信的是“事情该怎么做就怎么做”，承诺过的事一定落地。不喜欢临时改，因为改一次就要重新算一遍。",
      "代价是变化真的来的时候，你需要比多数人更长的时间重新站稳。"],
    ISFJ: ["守卫者", "Defender",
      "记得住别人随口提过的小事，也默默把它们办了。很少邀功，被当成理所当然时会有点难过。",
      "代价是你很少提要求，于是很少有人想到要问你想要什么。"],
    ESTJ: ["总经理", "Executive",
      "处理现实问题的效率很高，看不惯拖泥带水。规矩对你是秩序，不是束缚。",
      "代价是你容易把“我认为对的”直接当成“应该的”。"],
    ESFJ: ["执政官", "Consul",
      "在意一个群体里的关系是不是顺的，会主动去缝补那些裂缝。被人需要让你踏实。",
      "代价是冲突让你不舒服，有时会用和气换掉本该说清的事。"],
    ISTP: ["鉴赏家", "Virtuoso",
      "动手比动嘴快，遇到问题先拆开看看。不太表态，但心里有数。",
      "代价是别人常常猜不到你的态度，只好自己补完剧情。"],
    ISFP: ["探险家", "Adventurer",
      "对具体的美感和当下的感受很敏锐，不喜欢被规定该怎么活。安静，但有自己很硬的底线。",
      "代价是你不擅长为自己争，很多该得的东西就这么过去了。"],
    ESTP: ["企业家", "Entrepreneur",
      "在现场的反应速度远超计划时的思考，越是突发越来劲。喜欢事情真的发生。",
      "代价是长远的那部分，常常被推给以后。"],
    ESFP: ["表演者", "Entertainer",
      "身上有种把气氛点起来的能力，也真心享受此刻。",
      "代价是不太喜欢回看，同一个坑可能踩两次。"]
  };

  var answers = new Array(QUESTIONS.length).fill(null);
  var current = 0;

  var $ = function (id) { return document.getElementById(id); };
  var screens = { intro: $("screen-intro"), quiz: $("screen-quiz"), result: $("screen-result") };

  function show(name) {
    Object.keys(screens).forEach(function (k) {
      screens[k].classList.toggle("on", k === name);
    });
    $("actions").classList.toggle("show", name === "quiz" || name === "result");
    window.scrollTo(0, 0);
  }

  function renderBar() {
    var html = "";
    for (var i = 0; i < QUESTIONS.length; i++) {
      var cls = i < current ? "done" : (i === current ? "now" : "");
      html += '<i class="' + cls + '"></i>';
    }
    $("bar").innerHTML = html;
  }

  function renderQuestion() {
    var q = QUESTIONS[current];
    renderBar();

    $("qidx").innerHTML = "0" + (current + 1) + "<span> / 0" + QUESTIONS.length + "</span>";
    $("qdim").textContent = q.name;

    var opts = q.options.map(function (o) {
      var on = answers[current] === o.letter ? " on" : "";
      return '<button class="opt' + on + '" type="button" data-letter="' + o.letter + '">' +
        '<div class="opt-head">' +
          '<span class="opt-title">' + o.title + '</span>' +
          '<span class="tick"></span>' +
        '</div>' +
        (o.sub ? '<span class="opt-sub">' + o.sub + '</span>' : '') +
        '<p class="opt-body">' + o.body + '</p>' +
      '</button>';
    }).join("");

    $("quizBody").innerHTML = '<p class="scene">' + q.scene + '</p><div class="opts">' + opts + '</div>' +
      '<div class="check"><b>一句话自检</b>' + q.check + '</div>';

    Array.prototype.forEach.call($("quizBody").querySelectorAll(".opt"), function (el) {
      el.addEventListener("click", function () {
        answers[current] = el.getAttribute("data-letter");
        Array.prototype.forEach.call($("quizBody").querySelectorAll(".opt"), function (x) {
          x.classList.remove("on");
        });
        el.classList.add("on");
        updateNext();
        if (current < QUESTIONS.length - 1) {
          setTimeout(function () { current++; renderQuestion(); }, 260);
        }
      });
    });

    $("prevBtn").style.display = current === 0 ? "none" : "";
    updateNext();
  }

  function updateNext() {
    var btn = $("nextBtn");
    var ready = !!answers[current];
    btn.disabled = !ready;
    var last = current === QUESTIONS.length - 1;
    btn.textContent = last ? "查看结果" : "下一题";
  }

  function computeType() {
    return answers.map(function (a) { return a; }).join("");
  }

  function showResult() {
    var code = computeType();
    var t = TYPES[code] || TYPES.INTJ;

    $("rType").textContent = code;
    $("rName").innerHTML = t[0] + '<span class="en">' + t[1] + '</span>';
    $("rTag").textContent = t[2];
    $("rDesc").textContent = t[3] || "";

    var dims = [["E", "在热闹与互动中满血复活", "I", "在独处与静音中缓慢回温"],
                ["S", "迷恋真实可感的细节与经验", "N", "迷恋表象背后的规律与想象"],
                ["T", "帮 TA 理清症结，找到破局的办法", "F", "给 TA 情绪托底，让 TA 知道有人撑腰"],
                ["J", "尽早拍板落定，心里才踏实", "P", "留出机动空间，随时看情况调整"]];

    $("rDims").innerHTML = dims.map(function (d, i) {
      var picked = answers[i];
      var name = picked === d[0] ? d[1] : d[3];
      var other = picked === d[0] ? d[3] : d[1];
      var otherLetter = picked === d[0] ? d[2] : d[0];
      return '<li><div class="dim-main"><span class="p">' + picked + '</span><span class="n">' + name + '</span></div>' +
             '<div class="dim-alt">而非 ' + otherLetter + ' · ' + other + '</div></li>';
    }).join("");

    $("actions").innerHTML = '<div class="inner">' +
      '<button class="btn ghost" type="button" id="againBtn">重新测</button>' +
      '<button class="btn primary" type="button" id="shareBtn">复制结果</button>' +
      '</div>';

    $("againBtn").addEventListener("click", function () {
      answers = new Array(QUESTIONS.length).fill(null);
      current = 0;
      buildActions();
      show("quiz");
      renderQuestion();
    });

    $("shareBtn").addEventListener("click", function () {
      var text = "我的 MBTI 类型是 " + code + " " + t[0] + " · " + t[2];
      if (navigator.share) {
        navigator.share({ title: "MBTI 人格测试", text: text, url: location.href }).catch(function () {});
        return;
      }
      navigator.clipboard.writeText(text + " " + location.href).then(function () {
        $("shareBtn").textContent = "已复制";
        setTimeout(function () { $("shareBtn").textContent = "复制结果"; }, 1600);
      }).catch(function () {
        $("shareBtn").textContent = "复制失败";
        setTimeout(function () { $("shareBtn").textContent = "复制结果"; }, 1600);
      });
    });

    show("result");
  }

  function buildActions() {
    $("actions").innerHTML = '<div class="inner">' +
      '<button class="btn ghost" id="prevBtn" type="button">上一题</button>' +
      '<button class="btn primary" id="nextBtn" type="button" disabled>下一题</button>' +
      '</div>';
    $("prevBtn").addEventListener("click", function () {
      if (current > 0) { current--; renderQuestion(); }
    });
    $("nextBtn").addEventListener("click", function () {
      if (!answers[current]) return;
      if (current < QUESTIONS.length - 1) { current++; renderQuestion(); }
      else { showResult(); }
    });
  }

  buildActions();
  $("startBtn").addEventListener("click", function () {
    show("quiz");
    renderQuestion();
  });

  document.addEventListener("keydown", function (e) {
    if (!screens.quiz.classList.contains("on")) return;
    if (e.key === "1" || e.key === "2") {
      var idx = e.key === "1" ? 0 : 1;
      var opts = $("quizBody").querySelectorAll(".opt");
      if (opts[idx]) opts[idx].click();
    }
    if (e.key === "Enter" && !$("nextBtn").disabled) $("nextBtn").click();
  });
})();
</script>
</body>
</html>
